# Cuts a release: push a tag v<x.y.z>. Native jobs build into a draft; a final
# job checks the real uploaded updater manifest before publishing the release.
#
# plugins.updater.endpoints points at
# https://github.com/invisor/smetana/releases/latest/download/latest.json,
# which resolves against the latest published release only. The draft stays
# invisible to that endpoint until every desktop package and manifest check passes.
#
# What this depends on was done by a person, once, and is in place — RELEASING.md
# records what was done and where the private halves live. Two separate
# signatures, and they answer different questions:
#   * Tauri's own, over the updater artefacts. npm run tauri signer generate,
#     with the public key committed as plugins.updater.pubkey in
#     src-tauri/tauri.conf.json, and TAURI_SIGNING_PRIVATE_KEY and
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD as repository secrets. It is what an
#     installed copy checks before it replaces itself.
#   * Apple's, over the bundle. A Developer ID Application certificate and an
#     App Store Connect key for notarization, as the six APPLE_*/KEYCHAIN_*
#     secrets. It is what macOS checks before it will run the result — and,
#     less obviously and more expensively, what a granted folder permission is
#     stored against, which is why an ad-hoc signature cost a person every
#     grant on every update.
# The check job below refuses to build if the public key is ever empty, because
# a release with an unsigned latest.json cannot be installed as an update by
# anybody, and refuses if any of the six is, because that failure is silent.
name: Release

on:
  push:
    tags:
      - 'v*'

# The two draft upload jobs and the final publication job need release write access.
permissions:
  contents: read

# Every third-party action here is pinned by major tag rather than by sha, which
# is a choice about how versions move and not an oversight: a tag was already the
# convention in this file, and pinning by sha is a decision about reproducible
# builds worth taking whole rather than in passing.
#
# checkout and setup-node are on v5 because v4 targets Node 20, which GitHub has
# deprecated: v0.1.24's log carried "the following actions target Node.js 20 but
# are being forced to run on Node.js 24". The runner substitutes the runtime
# today; when it stops, the action stops with it, and a release is the only thing
# that runs this file. The other two were checked at the same time and left
# alone, because neither can raise that warning: dtolnay/rust-toolchain@stable is
# a composite action with no Node runtime of its own, and tauri-apps/tauri-action@v1
# already declares node24. tauri-action in particular carries the whole of the
# signing and publishing, so its major version is its own piece of work with its
# own check, never a line in somebody else's.
jobs:
  # Runs once, before any of the matrix, so a mismatch costs a few seconds
  # rather than a full macOS build.
  check:
    name: Check the tag and the signing key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # tauri.conf.json is the single source of the version: it is what
      # getVersion() reports inside the app and the number a person quotes in a
      # bug report. package.json and Cargo.toml carry their own and mean
      # nothing. If the tag and the conf disagree, latest.json would announce a
      # version the bundle does not carry, and every installed copy would try
      # to update to it for ever.
      - name: Check the tag against the version in tauri.conf.json
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$conf" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} and version ${conf} in src-tauri/tauri.conf.json disagree — the tag says ${tag}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches version ${conf} in src-tauri/tauri.conf.json"

      - name: Check the updater public key has been filled in
        run: |
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          if [ -z "$pubkey" ]; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is empty — run npm run tauri signer generate, commit the public key, and set TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD as repository secrets. See RELEASING.md."
            exit 1
          fi

      # Checked here for the same reason the updater key is, and it is the
      # sharper of the two: a missing signing secret does not stop the build,
      # it changes what the build produces. The bundler signs with whatever
      # identity it is handed and notarizes only when notarization credentials
      # are there, warning and carrying on when they are not — so a release cut
      # with one secret empty is published looking exactly like a signed one,
      # and the first person to find out is whoever downloads it and is told
      # the app is damaged. Six seconds on ubuntu against a full macOS build
      # and a bad release nobody can unpublish from a tag.
      - name: Check the macOS signing secrets have been set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_P8; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::repository secrets are empty or unset:${missing} — the bundle would be published unsigned or unnotarized without saying so. See the Developer ID section of RELEASING.md."
            exit 1
          fi
          echo "all six macOS signing secrets are set"

  release:
    name: Build and upload to draft
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Each row reads and merges latest.json before uploading it. Serialize
      # writers so the second row keeps the first row's platform entries.
      max-parallel: 1
      matrix:
        # Native builds: fetch-bd and build-smetanad use the runner triple,
        # which must match the bundle target for both embedded sidecars.
        include:
          - platform: macos-latest
            rustTargets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            rustTargets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu --bundles appimage,deb

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      # Before npm ci, and that ordering is load-bearing twice over. postinstall
      # runs scripts/fetch-bd.mjs, which asks rustc for the host triple; and its
      # --optional flag is deliberately ignored when CI is set, so on a runner a
      # missing toolchain would fail the install outright rather than warn.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustTargets }}

      - name: Install the Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2

      - name: Install the front-end dependencies
        run: npm ci

      # The failing form, never --optional: bd ships inside the bundle
      # (bundle.externalBin) and src-tauri/binaries/ is gitignored, so a bundle
      # built without this step is an app that cannot do anything at all.
      # postinstall has usually put the binary there already, in which case this
      # says so and downloads nothing — it is the guarantee, not the download.
      - name: Fetch the bd sidecar
        run: npm run fetch-bd

      # The other sidecar, and the one that is built here rather than fetched: the desktop is a client
      # of a local `smetanad` and the bundle ships it beside bd (bundle.externalBin). `tauri build`
      # runs the same script as its beforeBuildCommand; it is a step of its own so that a server that
      # does not compile stops the release before the bundler and its signing, with its own log.
      - name: Build the smetanad sidecar
        run: npm run build-smetanad -- --release

      # The certificate lives in a keychain this step makes and nothing else
      # uses, rather than in the runner's login keychain: a runner is thrown
      # away after the job, but a default keychain with a private key in it is
      # readable by every later step of the same job, and there is no reason
      # for npm or cargo to be near it.
      #
      # The identity string is read back out of that keychain instead of being
      # carried as a secret of its own, and that is the decision worth keeping.
      # APPLE_SIGNING_IDENTITY has to match the certificate's common name
      # exactly — "Developer ID Application: <name> (<team id>)" — so a copy
      # held separately is a second place to get one character wrong, and it
      # would go wrong silently: codesign would refuse, tauri would warn, and
      # the release would publish. Derived here there is only ever one spelling
      # and it is the certificate's own. The grep is what turns "the wrong
      # certificate was uploaded" into a stopped build with the identities it
      # did find printed under it — an Apple Development certificate imports
      # perfectly well and signs nothing Gatekeeper accepts.
      - name: Import the Developer ID certificate
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          p12="$RUNNER_TEMP/certificate.p12"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          # Both of these, and they are not the same thing. The default keychain
          # is where a new item is filed; the search list is where codesign
          # looks, and setting the first does not touch the second — a build
          # that skips this line imports the certificate perfectly and then
          # fails to find any identity by that name. The existing list is
          # carried along rather than replaced, so nothing the runner image put
          # there stops resolving.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # An hour, stated rather than left to whatever the default is: a
          # keychain that re-locks partway through a build fails the signature
          # it was unlocked for, and the error names the identity rather than
          # the lock, so the hour is bought against a confusing failure and not
          # against a likely one.
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, the first codesign of the build opens a dialog asking
          # to use the key — on a runner that is a job that hangs until it is
          # cancelled rather than an error anybody can read.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm -f "$p12"
          identity="$(security find-identity -v -p codesigning build.keychain \
            | grep 'Developer ID Application' | head -n 1 | awk -F'"' '{print $2}')"
          if [ -z "$identity" ]; then
            echo "::error::the imported certificate carries no Developer ID Application identity — an Apple Development certificate is not one, and cannot produce a bundle Gatekeeper accepts. What was imported:"
            security find-identity -v -p codesigning build.keychain
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "signing as $identity"

      # Notarization authenticates as an App Store Connect API key rather than
      # as an Apple ID with an app-specific password. Both are accepted by the
      # bundler; the key is the one that does not stop working when the account
      # holder turns two-factor authentication over to a new phone, and it can
      # be revoked on its own without touching anything else the account can do.
      # APPLE_API_KEY is the Key ID rather than the key, which reads wrongly and
      # is Tauri's naming: the key itself is the .p8, and what the bundler wants
      # is a path to it.
      - name: Write the App Store Connect key for notarization
        if: startsWith(matrix.platform, 'macos')
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc-api-key.p8"
          umask 077
          printf '%s' "$APPLE_API_KEY_P8" | base64 -D > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"

      # What the signature is for is not Gatekeeper's first-launch dialog, which
      # notarization settles on its own, but the code requirement a macOS
      # permission is stored against. An ad-hoc signature's requirement is a
      # cdhash, which changes with every build, so every folder a person had
      # granted stopped matching the moment they updated in place — and because
      # the stored decision survives, macOS never asked again. It showed up in
      # the system log as "Failed to match existing code requirement for subject
      # com.invisor.smetana". Signed with a Developer ID the requirement is the
      # team, so a grant outlives the build it was given to.
      #
      # bundle.macOS.signingIdentity in src-tauri/tauri.conf.json stays "-" and
      # is overridden here by APPLE_SIGNING_IDENTITY, which is documented to
      # take precedence over it. Leaving it is deliberate: without some identity
      # in that field a local build never calls codesign at all and what comes
      # out is whatever the linker put on the arm64 executable by itself —
      # adhoc and linker-signed, Info.plist unbound, no sealed resources, which
      # Gatekeeper reads as a broken signature rather than an unknown developer.
      # v0.1.1 shipped that way. The certificate is not on a laptop and should
      # not be; "-" is what a laptop gets, and the runner gets the real one.
      #
      # The minisign signature is a different thing entirely: Tauri's own,
      # mandatory, and what the app's updater verifies before it replaces
      # itself. Nothing about code signing touches it.
      - name: Build the bundle and upload to the draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ env.APPLE_API_KEY_PATH }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Smetana ${{ github.ref_name }}'
          releaseBody: |
            macOS (Apple silicon): download the .dmg and drag Smetana to Applications.
            Linux (x86_64): download the .deb for Ubuntu 22.04/24.04, or run the
            AppImage after making it executable. See README.md for dependencies.

            The app checks for signed updates and asks before installing them.
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Check the Linux release packages
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          bundle=src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
          bash scripts/check-linux-bundles.sh "$bundle"

      # Keep the release in draft until this check has passed. The bundler can
      # warn and continue after a missing notarization credential, so its green
      # build alone does not prove a usable macOS download.
      #
      # The three questions are the three halves of what a Developer ID buys.
      # TeamIdentifier is the one the permissions depend on — it is what the
      # stored code requirement matches against, and "not set" is exactly the
      # ad-hoc signature this change exists to retire. spctl is Gatekeeper's own
      # answer and has to name the source as Notarized: an unnotarized Developer
      # ID bundle signs and verifies perfectly and is still refused on a
      # double-click. stapler is the third because notarization can succeed
      # while the ticket never reaches the bundle, and a copy without one is
      # only accepted while the machine opening it can reach Apple.
      - name: Check the bundle really is signed, notarized and stapled
        if: startsWith(matrix.platform, 'macos')
        run: |
          set -euo pipefail
          app="$(find src-tauri/target -type d -name '*.app' -path '*/bundle/macos/*' | head -n 1)"
          if [ -z "$app" ]; then
            echo "::error::no .app was found under src-tauri/target — the bundle cannot be checked"
            exit 1
          fi
          echo "checking $app"
          codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          if ! grep -q '^TeamIdentifier=' "$RUNNER_TEMP/codesign.txt" \
             || grep -q '^TeamIdentifier=not set' "$RUNNER_TEMP/codesign.txt"; then
            echo "::error::the draft bundle carries no TeamIdentifier — it was signed ad-hoc, and every permission a person grants it will stop matching on their next update. Leave the release as a draft and repair the build."
            exit 1
          fi
          if ! spctl -a -vvv -t exec "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt" \
             || ! grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"; then
            echo "::error::Gatekeeper does not accept the draft bundle as notarized. Leave the release as a draft and repair the build."
            cat "$RUNNER_TEMP/spctl.txt"
            exit 1
          fi
          if ! xcrun stapler validate "$app"; then
            echo "::error::the notarization ticket is not stapled to the draft bundle, so it is only accepted on a machine that can reach Apple. Leave the release as a draft and repair the build."
            exit 1
          fi

          # The .dmg is reported and never fails the job, and the asymmetry is
          # the point. The bundler notarizes and staples the .app and then only
          # *signs* the disk image built around it — nothing in this repository
          # decides that, and a check that failed on it would fail every release
          # over a decision made upstream. What a person downloads is the .dmg,
          # so what Gatekeeper makes of it is worth knowing; the first release
          # cut with a certificate is where the answer comes from, and it comes
          # from this line rather than from anybody's reasoning about it.
          # Accepted here and the pair is finished. Refused, and the app inside
          # is still stapled and still opens once it is dragged out — but the
          # image warns on the way, and the way past that is notarizing the
          # image too, which means taking the publish out of tauri-action's
          # hands. That is a task, not an edit.
          dmg="$(find src-tauri/target -type f -name '*.dmg' | head -n 1)"
          if [ -n "$dmg" ]; then
            echo "assessing $dmg"
            if spctl -a -vvv -t open --context context:primary-signature "$dmg" 2>&1 | tee "$RUNNER_TEMP/dmg.txt"; then
              echo "::notice::Gatekeeper accepts the disk image: $(cat "$RUNNER_TEMP/dmg.txt" | tr '\n' ' ')"
            else
              echo "::warning::Gatekeeper does not accept the disk image itself — the app inside is stapled and opens once dragged out, but the .dmg warns on the way. $(cat "$RUNNER_TEMP/dmg.txt" | tr '\n' ' ')"
            fi
          fi

      - name: Save the macOS updater signature for final manifest verification
        if: startsWith(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: updater-signatures-macos
          path: src-tauri/target/**/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Save the Linux updater signatures for final manifest verification
        if: startsWith(matrix.platform, 'ubuntu')
        uses: actions/upload-artifact@v4
        with:
          name: updater-signatures-linux
          path: |
            src-tauri/target/**/bundle/deb/*.deb.sig
            src-tauri/target/**/bundle/appimage/*.AppImage.tar.gz.sig
          if-no-files-found: error

  publish:
    name: Verify draft and publish
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-signatures-*
          path: ${{ runner.temp }}/updater-signatures
          merge-multiple: true
      - name: Install pinned minisign verifier
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz -o "$RUNNER_TEMP/minisign.tar.gz"
          echo '9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  '"$RUNNER_TEMP/minisign.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/minisign.tar.gz" -C "$RUNNER_TEMP" minisign-linux/x86_64/minisign
          sudo install -m 0755 "$RUNNER_TEMP/minisign-linux/x86_64/minisign" /usr/local/bin/minisign
      - name: Check the uploaded release and its actual latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # GitHub's release-by-tag endpoint cannot return a draft.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            | jq -s --arg tag "$GITHUB_REF_NAME" \
              '[.[][] | select(.tag_name == $tag)] | if length == 1 then .[0] else error("expected one draft release") end' \
            > "$RUNNER_TEMP/release.json"
          asset_id="$(jq -r '.assets[] | select(.name == "latest.json") | .id' "$RUNNER_TEMP/release.json")"
          test -n "$asset_id"
          gh api -H 'Accept: application/octet-stream' \
            "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$RUNNER_TEMP/latest.json"
          node scripts/check-linux-update-manifest.mjs \
            "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/release.json" \
            "$RUNNER_TEMP/updater-signatures" "${GITHUB_REF_NAME#v}"
          # Tauri can warn and keep building when the signing secret does not
          # match the committed public key. Verify uploaded bytes, not only the
          # manifest and local signature text, before making updates visible.
          node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey" \
            | base64 -d > "$RUNNER_TEMP/updater.pub"
          mkdir -p "$RUNNER_TEMP/draft-assets"
          for platform in darwin-aarch64 linux-x86_64-appimage linux-x86_64-deb; do
            url="$(jq -r --arg platform "$platform" '.platforms[$platform].url' "$RUNNER_TEMP/latest.json")"
            asset_id="$(jq -r --arg url "$url" '.assets[] | select(.url == $url) | .id' "$RUNNER_TEMP/release.json")"
            asset_name="$(jq -r --arg url "$url" '.assets[] | select(.url == $url) | .name' "$RUNNER_TEMP/release.json")"
            test -n "$asset_id"
            test "$asset_name" = "$(basename "$asset_name")"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "$RUNNER_TEMP/draft-assets/$asset_name"
            jq -r --arg platform "$platform" '.platforms[$platform].signature' \
              "$RUNNER_TEMP/latest.json" | base64 -d > "$RUNNER_TEMP/$platform.minisig"
            minisign -Vm "$RUNNER_TEMP/draft-assets/$asset_name" \
              -p "$RUNNER_TEMP/updater.pub" -x "$RUNNER_TEMP/$platform.minisig"
          done
          release_id="$(jq -r '.id' "$RUNNER_TEMP/release.json")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false --silent

  # The headless server, one archive per platform, attached after publication.
  # It is a plain `cargo build` of crates/smetanad (no Tauri, no webview, no signing identity: a
  # tarball a person unpacks on a server), so it needs none of the secrets the bundle does and none
  # of the matrix above - its own matrix is the platforms a server runs on, and each row builds for
  # the runner's own architecture for the reason fetch-bd gives (it fetches `bd` for the host triple,
  # and the archive carries that `bd` beside the server, where `smetanad run` looks for it first).
  #
  # `needs: publish` keeps the server archive behind the verified desktop release;
  # `gh release upload` onto a tag with no release is an error. A failed row here leaves
  # the app's release in place and the missing archive visible as missing, which is the right way
  # round - the server is not the thing a desktop update depends on.
  #
  # Install instructions: server/smetanad/README.md, which is in every archive.
  smetanad:
    name: Server archive (${{ matrix.target }})
    needs: publish
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the server
        run: cargo build --release --manifest-path crates/smetanad/Cargo.toml --bin smetanad

      # Only the script, not `npm ci`: it needs rustc and node and nothing from node_modules, and a
      # server archive should not wait for the front end's dependencies. The failing form, for the
      # reason the app's job gives: an archive without `bd` is a server that cannot do anything.
      - name: Fetch the bd it drives
        run: node scripts/fetch-bd.mjs

      - name: Lay out and pack the archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="smetanad-${version}-${TARGET}"
          dir="dist-server/${name}"
          exe=""
          case "$TARGET" in *windows*) exe=".exe" ;; esac
          mkdir -p "$dir"
          cp "crates/smetanad/target/release/smetanad${exe}" "$dir/smetanad${exe}"
          # fetch-bd lays bd out as src-tauri/binaries/bd-<host triple>[.exe]; the server looks for
          # `bd` beside itself.
          bd="$(ls src-tauri/binaries/bd-* | head -n 1)"
          cp "$bd" "$dir/bd${exe}"
          # -L: resources hold a symlink (superpowers/AGENTS.md -> CLAUDE.md), and Git Bash on Windows
          # cannot create one without developer mode; the archive carries the file itself instead.
          cp -RL src-tauri/resources "$dir/resources"
          cp LICENSE "$dir/LICENSE"
          cp server/smetanad/README.md "$dir/README.md"
          case "$TARGET" in *linux*) cp server/smetanad/smetanad.service "$dir/smetanad.service" ;; esac
          cd dist-server
          case "$TARGET" in
            *windows*)
              7z a -tzip "${name}.zip" "${name}" > /dev/null
              archive="${name}.zip" ;;
            *)
              tar -czf "${name}.tar.gz" "${name}"
              archive="${name}.tar.gz" ;;
          esac
          if command -v sha256sum > /dev/null; then sha256sum "$archive" > "${archive}.sha256"; else shasum -a 256 "$archive" > "${archive}.sha256"; fi
          echo "ARCHIVE=dist-server/${archive}" >> "$GITHUB_ENV"
          ls -l

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" "$ARCHIVE" "${ARCHIVE}.sha256" --clobber
