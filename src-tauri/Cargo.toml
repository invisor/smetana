[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
notify = "8"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
chrono = "0.4"
vt100 = "0.16.2"
portable-pty = "0.9.0"
base64 = "0.23.0"
toml = "1.0.7"

# Only to send a signal to a PTY session's process group on the exit path
# (`terminal/pty.rs`): portable-pty's own `kill` is SIGKILL to the direct
# child alone. Nothing else in the tree touches libc, and Windows has no
# equivalent to send, hence the target gate.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
