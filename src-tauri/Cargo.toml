[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# The first of the two things the app hands to the operating system rather than
# doing itself. The About tab's link has to open in the person's browser, not
# inside the webview, where it would replace the app with a web page and leave
# no way back; and the file tree's menu asks the platform's own file manager to
# show an entry, which is a window this app has no business drawing.
tauri-plugin-opener = "2"
# The second: the file tree's menu puts a path on the system clipboard. A plugin
# rather than `navigator.clipboard`, which wants a secure context and a gesture
# the webview does not always agree it had.
#
# The price, because an exception in this tree is bought and not overlooked (see
# `src/catppuccinIcon.js`, which carries its own measurements): one `writeText`
# costs 34 crates in `Cargo.lock`. The plugin takes `arboard`, whose default
# `image-data` feature pulls a whole image codec stack — `image`, `tiff`,
# `zune-jpeg`, `zune-core`, `fax`, `moxcms`, `weezl` — for clipboard *pictures*,
# which nothing in this app reads or writes, plus `wl-clipboard-rs`, five
# `wayland-*` crates and `x11rb` for the Linux target.
#
# It cannot be turned off from here, and that was checked rather than assumed:
# `tauri-plugin-clipboard-manager` 2.3.2 declares no `[features]` of its own and
# depends on `arboard` with default features on, so there is no switch to pass
# through. Dropping it would mean forking the plugin or a `[patch]` on arboard,
# and neither is worth the maintenance for a binary budget this does not
# threaten. Revisit if the plugin ever grows a feature for it.
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
thiserror = "2"
notify = "8"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
chrono = "0.4"
vt100 = "0.16.2"
portable-pty = "0.9.0"
base64 = "0.23.0"
toml = "1.0.7"
# Editing `.smetana/project.toml` in place, for the project settings dialog.
# The obvious implementation — deserialize, change a field, `toml::to_string`
# — is the wrong one: that file is written by the setup agent, which puts prose
# in it (`[merge].hazards` is explicitly text a lead reads), and people write
# comments in it besides. A serde round trip keeps neither, so somebody who
# changed one number would find the file reordered and a colleague's note gone.
# `runs/config.rs::with_defaults` touches four keys and leaves the rest of the
# bytes exactly where they were.
#
# The price, counted against `Cargo.lock` the way every other line here is:
# **nothing at all**. 0.25.13 is already in the lock file under
# `proc-macro-crate`, and the one feature this adds to it — `display`, which is
# what turns an edited document back into text — takes `toml_writer`, which is
# already there for `toml`'s own sake. No new `[[package]]` entry, no download,
# and no other crate moves version. The version is pinned to the major already
# in the tree for exactly that reason: `0.23` would have been a second copy of
# a format-preserving TOML parser for no gain.
toml_edit = "0.25"
# Delete in the file tree's menu, which puts an entry in the system trash rather
# than removing it. A deletion somebody can undo from their own file manager is
# a smaller promise than a permanent one, and this is a tree of somebody's
# sources — `std::fs::remove_dir_all` would be the whole of a folder gone with
# nothing anywhere to get it back from.
#
# The price, counted the way the clipboard plugin's is above: seven entries in
# `Cargo.lock`, and only two of them build on any one machine. `trash` itself
# and `urlencoding`; the other five are the `windows` 0.56 family, which the
# Recycle Bin is reached through and which no other target compiles. On macOS it
# takes `objc2` and `objc2-foundation`, and on Linux `zbus` — all three are
# already here for Tauri's own sake, so the added weight is the crate itself.
trash = "5"

# What stops the machine falling asleep under a run. A run is the app driving
# itself for hours, usually at night, with nobody touching the keyboard or the
# mouse — which is precisely what an idle timer reads as "nobody is here", and
# the pause that waits out a spent allowance (`runs/usage.rs`) is the longest
# such silence in the whole app. `runs/awake.rs` holds one assertion for as long
# as any run is live anywhere.
#
# A crate rather than the child process this repository's habit would suggest
# — `caffeinate -i -w <pid>` on macOS, `systemd-inhibit … sleep infinity` on
# Linux, killed to release — which costs no dependency at all and sits beside
# the bd, PTY and preflight processes already spawned here. It breaks on
# Windows, which has no equivalent utility: `SetThreadExecutionState` is an API
# call, and a thread-affine one, so that third of the feature would have been
# raw FFI whatever else was done, and hand-written FFI for a platform nobody
# builds this project for is code no one is in a position to notice is wrong.
#
# `default-features = false` is about what sits behind the crate's `bin`
# feature: `clap`, `clap_complete`, `anyhow`, `ctrlc`, `sysinfo`, `shadow-rs`
# and `winresource`, every one of them for its own command-line tool. Checked
# rather than assumed, the way the clipboard plugin's features were: 0.6.1
# carries no `default` key at all and `bin` is opt-in, so the flag changes
# nothing today — it is written so that a release making `bin` a default cannot
# quietly put those seven in the lock file.
#
# The price, counted against `Cargo.lock` rather than guessed at: one power
# assertion costs 13 `[[package]]` entries, and only one of them is the crate
# itself. `zbus` is **not** among them, contrary to the obvious guess — this
# tree already carries 5.19.0 behind `tauri-plugin-opener`'s own Linux gate, so
# the D-Bus implementation arrives with nothing new under it. What does arrive
# lands on *every* platform, this macOS build included: `derive_builder` with
# its `_core` and `_macro` halves, whose 0.20.2 wants `darling ^0.20` and so
# puts a **second** `darling`, `darling_core` and `darling_macro` at 0.20.11
# beside the 0.23.0 already here — six crates of build-time proc macro for a
# builder over a struct of six fields. macOS then adds `objc2-io-kit`, and
# Windows a second `windows` major, 0.62.2 against the 0.61.3 in the tree, with
# `windows-collections`, `windows-future`, `windows-numerics` and
# `windows-threading` to match, none of which anything here ever compiles.
# Nothing is removed and no other crate moves version.
keepawake = { version = "0.6", default-features = false }

# The login item: whether the app opens itself when the person signs in. A
# plugin rather than the platform calls, because there are three of them and no
# two look alike — a `~/Library/LaunchAgents` plist on macOS, a registry value
# under `Run` on Windows, a `.desktop` file in `~/.config/autostart` on Linux —
# and each is a file format this app would otherwise have to write correctly
# from memory, on a machine nobody here is testing on.
#
# The price, counted against `Cargo.lock` the way the clipboard plugin's and
# keepawake's are above: four `[[package]]` entries. `auto-launch` itself, and
# `dirs` 4.0 with `dirs-sys` and `redox_users` under it, for the one question of
# where the home directory is. `dirs` 4 is a second major beside the `dirs` 6
# already in the tree, which is `auto-launch` being a version behind rather than
# anything to fix here. Nothing is removed and no other crate moves version.
#
# What is deliberately **not** stored is the switch's position: the login item
# in the operating system is the whole of the truth, and `settings.json` holds
# no copy of it. `src-tauri/src/autostart.rs` records why.
tauri-plugin-autostart = "2.5.1"

# Updating in place: fetch `latest.json` off the release the workflow published,
# check the minisign signature against `plugins.updater.pubkey`, replace the
# bundle. A plugin rather than anything of ours, because the signature check is
# the whole of the security here and re-implementing minisign verification
# against a downloaded archive is not a thing to do by hand.
#
# The price, counted against `Cargo.lock` rather than guessed at: **32
# `[[package]]` entries**, of which 19 compile on this macOS build and 13 never
# do here. Nothing is removed and no other crate moves version; `reqwest`,
# `flate2`, `semver`, `time`, `tempfile` and `url` were all already in the tree,
# so the HTTP client is not part of the bill.
#
# Where they go, traced with `cargo tree -i` rather than eyeballed. **Twenty-two
# are TLS**, all of them behind the default `rustls-tls` feature, which is a
# feature of `reqwest` — already in the tree — rather than a client of its own:
# `rustls`, `rustls-pki-types`, `rustls-webpki`, `tokio-rustls`, `hyper-rustls`,
# `ring` with `untrusted` and a fifth `windows-sys` major (0.52, beside the
# 0.45.0, 0.59.0, 0.60.2 and 0.61.2 already in the lock file), `zeroize`,
# `subtle`, and the whole of `rustls-platform-verifier`
# — its `-android` half, `rustls-native-certs`, `webpki-root-certs`,
# `openssl-probe`, `schannel`, `security-framework` with its `-sys`, and `jni`,
# `jni-macros`, `simd_cesu8`, `simdutf8` for an Android target nobody builds.
# The alternative was checked rather than assumed: `default-features = false`
# with `native-tls` would drop most of them and buy a build-time dependency on
# system OpenSSL for the Linux target, which is why the plugin ships rustls as
# its default in the first place.
#
# **Six are archives**, from the `zip` feature — `zip` with `arbitrary` and
# `derive_arbitrary` under it, and `tar` with `filetime` and `xattr`. The
# feature cannot be turned off on the platform whose name is not in it: macOS
# installs from the `.app.tar.gz`, so `tar` and the `flate2` already in the tree
# are behind that same switch, while `zip` itself is the Windows half and never
# compiles here.
#
# **Four are the work itself**: the plugin, `minisign-verify` for the signature,
# and `osakit` with `objc2-osa-kit` for the AppleScript prompt macOS needs when
# the bundle sits somewhere this user cannot write to.
#
# What is deliberately **not** granted is anything in
# `capabilities/default.json`: the front end calls `updates_*`, never
# `plugin:updater|*`, and `src-tauri/src/updates.rs` records why the grant would
# be a hole rather than a formality.
tauri-plugin-updater = "2.10.1"

# The other half of the pair above, and the cheapest dependency in this file:
# **one `[[package]]` entry**, itself, with nothing under it.
#
# It is registration and no more today, which is worth saying rather than
# leaving to be discovered. What it exposes is two commands for the webview,
# `exit` and `restart`; neither is granted in `capabilities/default.json`, and
# the relaunch after an install is made from Rust instead, in `updates.rs`.
#
# Which of the two `AppHandle` methods that relaunch uses is the part worth
# writing down, because the difference is silent and the cost is somebody's
# terminals. `request_restart` asks the event loop to leave, so `RunEvent::Exit`
# fires and `lib.rs` kills the PTY children on the way out; `restart` makes the
# same trip **only when it is called off the main thread**, and skips both
# events when it is not, which would leave every open session's process an
# orphan. `updates_install` calls `request_restart`, and its own doc comment
# says so.
#
# The plugin is **not** the hazard in that paragraph, and a follow-up designing
# a "restart later" from here should know it: its `restart` command is a thin
# wrapper over `app.request_restart()` — the identical call — so routing the
# press through the webview would be as safe as the Rust path, and the only
# question it raises is the ACL one. That is why this line stays: the updater's
# flow is documented as the pair, and a front-end-driven restart is the obvious
# next thing to want. If that never arrives, this is the line to delete.
tauri-plugin-process = "2.3.1"

# Process control the standard library does not expose, and it is described
# here by subject rather than by call site on purpose: a comment that counts
# the users or names the files reads as exhaustive, so the next person to reach
# for libc trusts it instead of correcting it, and the version of this note
# that named two callers was wrong about the tree it shipped in. What libc is
# for here is signalling a process group, so that killing something does not
# leave behind what it started; reading a process's own facts from the kernel,
# so that a recovered pid can be told from a recycled one; and the descriptor
# limit (`rlimit.rs`), which decides what every agent this app spawns inherits.
#
# Windows reaches none of it through this crate. Two of those subjects are
# simply absent there — no process group to signal, and nothing rationing
# descriptors to raise — while the third is only out of libc's reach rather
# than out of the platform's: a process's start time exists on Windows and is
# asked for by an API this dependency does not carry, so the answer there is
# that the question goes unasked. That is why the gate is not a portability
# shim but the honest shape of the subject, and why it would still be the right
# gate if somebody ever went and got those facts another way. What is behind it
# for the descriptor limit is a `raise()` with an empty body; the pure part of
# that module still compiles, and is still tested, on every platform.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The system clipboard for **files**, which is three formats and no crate that
# covers them: `tauri-plugin-clipboard-manager` above stays exactly what it is,
# the thing that puts a path on the clipboard as text, and has no notion of a
# file list on any platform. `files/clipboard.rs` carries the formats and the
# reasoning; what follows is what each half costs.
#
# The price, counted against `Cargo.lock` rather than guessed at: **nothing at
# all, on any of the three**. Every one of these crates is already in the lock
# file at the version pinned here, pulled in by Tauri or by something under it,
# and the majors were read off `cargo tree` rather than off the crates' own
# newest releases for exactly that reason — a `windows` 0.62 here would be the
# third copy of that family in the tree, and an `objc2` 0.5 a second.
#
# macOS: `NSPasteboard` with `public.file-url`. `objc2` 0.6.4, `objc2-app-kit`
# 0.3.2 and `objc2-foundation` 0.3.2 are already here behind `arboard` — which
# is the clipboard plugin's — and behind `tauri` itself, whose webview is
# `objc2-web-kit`.
#
# `default-features = false` is what makes the paragraph above true, and it was
# measured rather than assumed: these crates' `default` is very nearly `all` —
# every AppKit class there is — and taking it added `objc2-core-video` to the
# lock file and pulled CloudKit, Core Data, Core Image, Core Text and
# QuartzCore into `objc2-app-kit`'s feature set for a pasteboard. Named
# explicitly instead: `NSPasteboard` for the board, `NSPasteboardItem` for
# reading an item at a time, and `std`, which the two are written against.
# Cargo unions features across the tree, so nothing else here loses anything by
# this line.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSPasteboard",
  "NSPasteboardItem",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSString",
  "NSURL",
] }

# Windows: `CF_HDROP` for the paths and the registered `Preferred DropEffect`
# format for the mode. `windows` 0.61.3 is already in the lock file under `tao`,
# which is Tauri's window layer — deliberately that one and not the 0.56 under
# `trash` or the 0.62 under `keepawake`, both of which are a version the rest of
# the tree is not on. The features are modules of that one crate rather than
# crates of their own, so they cost compile time on a Windows build and no
# `[[package]]` entry anywhere.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Shell",
] }

# Linux: the GTK clipboard, `text/uri-list` and `x-special/gnome-copied-files`.
# `gtk` 0.18.2 is already in the lock file under `tao` and `muda` — this app
# *is* a GTK app on Linux — so naming it here adds nothing to the build but the
# ability to say so. `gdk` and `glib` come through it rather than being asked
# for separately, since a second path to the same crates is a second version to
# keep in step.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
