[package]
name = "remote-protocol"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Wire types shared by the desktop, the mobile app and the servers"
publish = false

[dependencies]
iroh = "1.3"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
serde_json = "1"
data-encoding = "2"
